name: CI
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --group dev
      - run: uv run --no-sync pytest -q
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --all-groups
      - run: uv run python scripts/generate_cli_reference.py --check
      - run: uv run sphinx-build -W --keep-going -b html docs docs/_build/html
      - run: uv build
      - run: |
          uv venv /tmp/snapshotfs-smoke
          uv pip install --python /tmp/snapshotfs-smoke/bin/python dist/*.whl
          cd /tmp
          /tmp/snapshotfs-smoke/bin/snapshotfs --help
          /tmp/snapshotfs-smoke/bin/python -c "import snapshotfs; import snapshotfs.store.sqlite"
      - uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: dist/*

  fuse:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y fuse3 libfuse3-dev pkg-config
      - run: uv sync --locked --group dev --extra fuse
      - run: if [ ! -e /dev/fuse ]; then sudo modprobe fuse; fi
      - run: uv run --no-sync pytest -q
        env:
          SNAPSHOTFS_MOUNT_TEST: '1'
